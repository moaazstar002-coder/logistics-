[project]
name = "masar-logistics-dashboard"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "pydantic",
    "argon2-cffi>=23.1.0,<26",
    "python-dotenv>=1.0,<2",
    "psycopg[binary]>=3.2,<4",
]

[tool.vercel]
entrypoint = "BackEnd.main:app"

[tool.vercel.scripts]
build = "python build_frontend.py"
